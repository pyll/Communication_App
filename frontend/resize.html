<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./bootstrap/bootstrap.min.css">
    <title>注册</title>
    <style>
        .contain {
            width: 320px;
            height: 500px;
            position: absolute;
            left: 50%;
            top: 50%;
            margin: -250px 0 0 -160px;
            border: 1px solid #999;
            /*border-radius: 10px;*/
            padding: 25px;
            box-sizing: border-box;
        }

        .top {
            width: 318px;
            position: relative;
            left: -25px;
            top: -25px;
            background: #fa729a;
            height: 50px;
            line-height: 50px;
            text-align: center;
            font-size: 21px;
            color: #fff;
        }

        .form-group {
            border: 2px solid #ccc;
            border-top: none;
            border-left: none;
            border-right: none;
            line-height: 30px;
            height: 30px;
            font-size: 15px;
            position: relative;
            /*text-indent: 5px;*/
        }

        .form-input {
            border: none;
            height: 20px;
            outline: none;
            margin-left: 8px;
        }

        label {
            color: #fa729a;
        }

        .login_btn {
            background: #fa729a;
            color: #fff;
            border: 1px solid #fa729a;
            margin-top: 10px;
            height: 35px;
            font-size: 16px;
        }

        .resize {
            color: #aaa;
        }

        a:hover {
            color: #fa729a;
            text-decoration: none;
        }
        .radio-input{
            position: absolute;
            left: 80px;
            top: 2px;
            width: 16px;
        }
        .radio-input:last-child{
            left: 143px;
        }
        .radio-label{
            margin-left: 20px;
        }
        .form-select{
            margin-left: 10px;
            width: 170px;
            height: 24px;
            line-height: 24px;
        }
    </style>
    <script src="./code/jquery.min.js"></script>
    <script src="./code/angular.min.js"></script>
</head>

<body ng-app="myApp">
    <div ng-controller="controLogin">
        <div class="contain">

            <div class="top">注册账号</div>
            <form class="form-login" name="form-login">
                <div class="form-group">
                    <label for="login_school">学校</label>
                    <select class="form-select"  name="login_school" ng-options="x.name for x in school" ng-model="login_school" ></select>
                </div>
                <div class="form-group">
                    <label for="login_sex">性别</label>
                    <label class="radio-inline"></label>
                    男<input type="radio" class="form-input radio-input" name="sex" id="nan" ng-model="login_sex" ng-value=0  required>
                    <label class="radio-inline radio-label"></label>
                    女<input type="radio" class="form-input radio-input" name="sex" id="nv" ng-model="login_sex" ng-value=1 required>
                </div>
                <div class="form-group">
                    <label for="login_user">账号</label>
                    <input type="text" class="form-input" name="login_user" id="login_user" ng-model="login_user"
                        required>
                </div>
                <div class="form-group">
                    <label for="login_pass">密码</label>
                    <input type="password" class="form-input" name="login_pass" id="login_pass" ng-model="login_pass"
                        required>
                </div>
                <div class="form-group">
                    <label for="login_repass">确认密码</label>
                    <input type="password" class="form-input" name="login_repass" id="login_repass" ng-model="login_repass"
                        required>
                </div>
               
                <button class="btn btn-primary login_btn btn-block" ng-click="login_ok()">确 认</button>
            </form>

        </div>

    </div>
    <script>
        var app = angular.module('myApp', []);
        app.controller('controLogin', function ($scope) {
            // 学校
            $scope.login_school = '';
            // 用户名
            $scope.login_user = '';
            //性别
            $scope.login_sex = 0;
            //密码
            $scope.login_pass = '';
            //确认密码
            $scope.login_repass = '';
            
            $scope.school = [
                { name: '广州大学', value: 1 },
                { name: '华南师范大学', value: 2 },
                { name: '星海音乐学院', value: 3 },
                { name: '中山大学', value: 4 },
                { name: '广东外语外贸大学', value: 5 },
                { name: '广州中医药大学', value: 6 },
                { name: '华南理工大学', value: 7 },
                { name: '广东工业大学', value: 8 }
            ];
            // 信息验证
            $scope.login_ok = function () {
                if (!$scope.login_school) {
                    alert("学校不能为空！");
                    return false;
                }
                if (!$scope.login_user) {
                    alert("账号不能为空！");

                    return false;
                }
                if (!$scope.login_pass) {
                    alert("密码不能为空！");
                    return false;
                }
                if (!$scope.login_repass) {
                    alert("确认密码不能为空！");
                    return false;
                }
                if ($scope.login_pass != $scope.login_repass) {
                    alert("密码与确认密码不同！");
                    return false;
                }
                var obj = {};
                obj.school = $scope.login_school.name;
                obj.username = $scope.login_user;
                obj.password = $scope.login_repass;
                obj.re_password = $scope.login_pass
                obj.gender = parseInt($scope.login_sex);
                console.log($scope.login_sex);
                console.log($scope.login_school);
                console.log($scope.login_school.name);
                console.log(obj);
                ajax(obj);
            }
            function location(t) {
                
                if (t.code == 200) {
                   
                    setTimeout(function () {
                        window.location.href = "./login.html";
                    }, 100);
                }
                
            }
            // 发送请求
            function ajax(temp) {
                $.ajax({
                    url: 'http://120.78.91.11:8000/user/register',
                    type: 'post',
                    // 设置的是请求参数
                    data: temp,
                    // 用于设置响应体的类型 注意 跟 data 参数没关系！！！
                    //dataType: 'json',
                    success: function (res) {
                        console.log(res);
                        var t = res;
                        location(t);
                    }
                })
            }
        });
    </script>
</body>

</html>
