<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./bootstrap/bootstrap.min.css">
    <title>好友</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .contain {
            width: 320px;
            height: 500px;
            position: absolute;
            left: 50%;
            top: 50%;
            margin: -250px 0 0 -160px;
            border: 1px solid #999;
            /*border-radius: 10px;*/
            /*padding: 25px;*/
            box-sizing: border-box;
        }

        .top {
            width: 318px;
            position: relative;
            left: 0;
            top: 0;
            background: #fa729a;
            height: 50px;
            line-height: 50px;
            text-align: center;

            color: #fff;
        }

        .bottom {
            width: 318px;
            position: absolute;
            left: 0;
            bottom: 0;
            border: 1px solid #aaa;
            height: 40px;
            line-height: 40px;
            border-bottom: none;
            /* text-align: center; */


            /* padding: 0 9px; */
        }

        a:hover {
            color: #fa729a;
            text-decoration: none;
        }


        .part2 {
            height: 395px;
            width: 100%;
        }

        .part_body {

            height: 100%;
            overflow: auto;
        }



        .name {
            font-size: 24px;
            width: 60px;
            margin-left: 20px;
        }

        .addfriend,
        .removefriend {
            position: absolute;
            right: 65px;
            top: 5px;
            height: 40px;
            cursor: pointer;
            display: none;
        }

        .cancel {
            position: absolute;
            right: 10px;
            top: 5px;
            height: 40px;
            cursor: pointer;
        }

        input {
            height: 39px;
            padding: 5px 0 4px 20px;
            border: none;
            outline: none;
            width: 80%;
        }

        .send {
            position: absolute;
            right: 0;
            top: 4px;
            width: 20%;
            line-height: 32px;
            text-align: center;
            height: 32px;
            color: #777;
            border-left: 1px solid #aaa;
            cursor: pointer;
        }

        .main {
            width: 100%;
            height: 30px;
            line-height: 29px;
            text-align: left;
            padding-left: 5px;
            margin: 5px 0;
        }

        .main1 {
            width: 100%;
            height: 30px;
            line-height: 29px;
            text-align: right;
            padding-right: 5px;
            margin: 5px 0;
        }

        .cont {
            display: inline-block;
            height: 29px;
            border: 1px solid #fa729a;
            padding: 0 10px;
            border-radius: 6px;
        }
        .main1 .cont{
            background: #fa729a;
            color: #fff;
        }
        .main .cont{
            color: #fa729a;
            background: #fff;
        }
        .main_top {}
    </style>
    <script src="./code/jquery.min.js"></script>
    <script src="./code/angular.min.js"></script>
</head>

<body ng-app="myApp">
    <div ng-controller="controLogin">
        <div class="contain">

            <div class="top">
                <div class="name">{{name}}</div>
                <div class="addfriend" ng-click="addFriend()">添加好友</div>
                <div class="removefriend" ng-click="removeFriend()">删除好友</div>
                <div class="cancel">返回</div>
            </div>
            <div class="part2">
                <div class="part_body">

                </div>

            </div>
            <div class="bottom">
                <input type="text" name="text" id="text" ng-model="roomtext">
                <div class="send" ng-click="ok()">发送</div>
            </div>
        </div>

    </div>
    <script>
        var url = decodeURI(location.search);
        var url_arr = url.split(',');
        console.log(url);
        var urlArr = url_arr[0].split('=')[1];
        //拿到接收方数据
        var touser = url_arr[1].split('=')[1];
        var app = angular.module('myApp', []);
        app.controller('controLogin', function ($scope) {
            $scope.name = touser;
            //发送内容
            $scope.roomtext = '';
            // 发送方
            $scope.from_user = '';
            //接收方
            $scope.to_user = touser;
            //房间名
            //$scope.roomname = '';
            var ws = '';
            $(document).keydown(function(e){
                if(e.keyCode==13){
                    $scope.ok();
                }
            });

            $scope.ok = function () {
                if (!$scope.roomtext) {
                    alert("发送内容不能为空");
                    return;
                }
                var obj = {};
                obj.roomname = $scope.from_user + '_' + $scope.to_user;
                obj.from_user = $scope.from_user;
                obj.to_user = $scope.to_user;
                obj.content = $scope.roomtext;
                console.log($scope.roomtext);
                console.log(obj);
                ajax(obj);
            }
            $scope.addFriend = function () {
                var obj = {};
                obj.username = touser;
                obj.token = urlArr;
                console.log(obj);
                if (confirm("是否要添加该好友？")) {
                    sendFriendAjax(obj);
                }

            }
            $scope.removeFriend = function () {
                var obj = {};
                obj.username = touser;
                obj.token = urlArr;
                if (confirm("是否要删除该好友？")) {
                    removeFriendAjax(obj);
                }
            }
            function removeFriendAjax(temp) {
                $.ajax({
                    url: 'http://120.78.91.11:8000/user/deleteFriend?token=' + urlArr,
                    type: 'post',
                    // 设置的是请求参数
                    data: temp,
                    // 用于设置响应体的类型 注意 跟 data 参数没关系！！！
                    //dataType: 'json',
                    success: function (res) {
                        console.log(res);
                        var t = res;
                        removeFn();
                    }
                })
            }
            function removeFn() {
                setTimeout(function () {
                    window.location.href = "./friend.html?username=" + urlArr;
                }, 0);
            }
            function sendFriendAjax(temp) {
                $.ajax({
                    url: 'http://120.78.91.11:8000/user/addFriend?token=' + urlArr,
                    type: 'post',
                    // 设置的是请求参数
                    data: temp,
                    // 用于设置响应体的类型 注意 跟 data 参数没关系！！！
                    //dataType: 'json',
                    success: function (res) {
                        console.log(res);
                        var t = res;
                        alert("添加好友已发送");
                    }
                })
            }
            $(".cancel").click(function () {
                window.history.go(-1);
                ws.onclose();
            });
            function init() {
                userajax();
                getFriendAjax();
            }
            function location(t) {

                if (t.code == 200) {


                }

            }
            var arr_data = [];
            // 发送websocket请求
            function ajax(temp) {


                ws.send(JSON.stringify({
                    'roomname': temp.roomname,
                    'from_user': temp.from_user,
                    'to_user': temp.to_user,
                    'content': temp.content
                }));
                $scope.roomtext = '';
                $("#text").val('');




            }
            //接收自己的信息
            function userajax() {
                $.ajax({
                    url: 'http://120.78.91.11:8000/user/getUserInfo?token=' + urlArr,
                    type: 'post',
                    // 设置的是请求参数
                    data: { token: urlArr },
                    // 用于设置响应体的类型 注意 跟 data 参数没关系！！！
                    //dataType: 'json',
                    success: function (res) {
                        console.log(res);
                        var t = res;
                        getUser(t);
                    }
                })
            }
            function getUser(res) {
                $scope.from_user = res.info.username;
                $(".part_body").html('');
                ws = new WebSocket("ws://120.78.91.11:8000/talk/websocketLink/" + $scope.from_user + '_' + $scope.to_user);
                ws.onopen = function (evt) {
                    console.log("Connection open ...");
                };

                ws.onmessage = function (evt) {
                    console.log("Received Message: " + evt.data);
                    arr_data = JSON.parse(evt.data);
                    console.log(111111, arr_data.content);
                    if (arr_data.to_user == arr_data.from_user) {
                        var temp = $('<div class="main1"><span class="cont">' + arr_data.content + '</span><span class="main_top"> :' + arr_data.from_user + '</span></div>');

                        $(".part_body").append(temp);
                    } else {
                        var temp = $('<div class="main"><span class="main_top">' + arr_data.from_user + ': </span><span class="cont">' + arr_data.content + '</span></div>');
                        $(".part_body").append(temp);
                    }
                };
                ws.onclose = function (evt) {
                    console.log("Connection closed.");
                };
            }
            // 发送得到好友数据请求
            function getFriendAjax() {
                $.ajax({
                    url: 'http://120.78.91.11:8000/user/getFriendList?token=' + urlArr,
                    type: 'post',
                    // 设置的是请求参数
                    data: { token: urlArr },
                    // 用于设置响应体的类型 注意 跟 data 参数没关系！！！
                    //dataType: 'json',
                    success: function (res) {
                        console.log(res);
                        var t = res;
                        isFriend(t);
                    }
                })
            }
            // 判断是否为好友
            function isFriend(t) {
                if (t.code == 200) {
                    for (var i = 0; i < t.info.length; i++) {
                        // 若是好友
                        if (t.info[i].username == touser) {
                            $(".removefriend").fadeIn();
                            $(".addfriend").fadeOut();
                            return;
                        }
                    }
                    $(".addfriend").fadeIn();
                    $(".removefriend").fadeOut();
                }
            }
            init();
        });
    </script>
</body>

</html>
