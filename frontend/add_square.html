<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./bootstrap/bootstrap.min.css">
    <title>发布广场动态</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .contain {
            width: 320px;
            height: 500px;
            position: absolute;
            left: 50%;
            top: 50%;
            margin: -250px 0 0 -160px;
            border: 1px solid #999;
            /*border-radius: 10px;*/
            /*padding: 25px;*/
            box-sizing: border-box;
        }

        .top {
            width: 318px;
            position: relative;
            left: 0;
            top: 0;
            background: #fa729a;
            height: 50px;
            line-height: 50px;
            text-align: center;
            font-size: 21px;
            color: #fff;
        }

        .form_select {
            width: 100%;
            height: 100%;
        }


        a:hover {
            color: #fa729a;
            text-decoration: none;
        }

        .part1 {
            width: 100%;
            height: 30px;
            padding: 0px 16px 0 0;
            text-align: center;
        }

        .part2 {
            height: 230px;
            width: 100%;
        }

        .part2_main {
            width: 100%;
            height: 100%;
        }

        .part3 {
            width: 80%;
            margin: 0 auto;
        }

        .login_btn {
            background: #fa729a;
            color: #fff;
            border: 1px solid #fa729a;
            margin-top: 10px;
            height: 35px;
            font-size: 16px;
        }
    </style>
    <script src="./code/jquery.min.js"></script>
    <script src="./code/angular.min.js"></script>
</head>

<body ng-app="myApp">
    <div ng-controller="controLogin">
        <div class="contain">

            <div class="top">发布广场动态</div>
            <div class="part2">
                <textarea cols="40" rows="8" class="part2_main" placeholder="在广场分享我的生活"
                    ng-model="login_user"></textarea>
            </div>
            <div class="part3">
                <button class="btn btn-primary login_btn btn-block" ng-click="login_ok()">确 认</button>
            </div>

        </div>

    </div>
    <script>
        var url = decodeURI(location.search);
        console.log(url);
        var urlArr = url.split('=')[1];
        var app = angular.module('myApp', []);
        app.controller('controLogin', function ($scope) {
            
            // 活动内容
            $scope.login_user = '';
           
            // 信息验证
            $scope.login_ok = function () {
                
                if (!$scope.login_user) {
                    alert("活动内容不能为空！");

                    return false;
                }
                var obj = {};
                obj.content = $scope.login_user;
                obj.token = urlArr;
                ajax(obj);
            }
            function init() {
               
                console.log(urlArr);
            }
            function location(t) {
                if (t.code == 200) {
                    setTimeout(function () {
                        window.location.href = "./square.html?username=" + urlArr;
                    }, 0);
                }

            }
            // 发送请求
            function ajax(temp) {
                $.ajax({
                    url: 'http://120.78.91.11:8000/square/addSquare?token=' + temp.token,
                    type: 'post',
                    // 设置的是请求参数
                    data: temp,
                    // 用于设置响应体的类型 注意 跟 data 参数没关系！！！
                    //dataType: 'json',
                    success: function (res) {
                        console.log(res);
                        var t = res;
                        location(t);
                    }
                })
            }
            init();
        });
    </script>
</body>

</html>
