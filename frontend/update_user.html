<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./bootstrap/bootstrap.min.css">
    <title>修改信息</title>
    <style>
        .contain {
            width: 320px;
            height: 500px;
            position: absolute;
            left: 50%;
            top: 50%;
            margin: -250px 0 0 -160px;
            border: 1px solid #999;
            /*border-radius: 10px;*/
            padding: 25px;
            box-sizing: border-box;
        }

        .top {
            width: 318px;
            position: relative;
            left: -25px;
            top: -25px;
            background: #fa729a;
            height: 50px;
            line-height: 50px;
            text-align: center;
            font-size: 21px;
            color: #fff;
        }

        .form-group {
            border: 2px solid #ccc;
            border-top: none;
            border-left: none;
            border-right: none;
            line-height: 30px;
            height: 30px;
            font-size: 15px;
            position: relative;
            /*text-indent: 5px;*/
        }

        .form-input {
            border: none;
            height: 20px;
            outline: none;
            margin-left: 8px;
        }

        label {
            color: #fa729a;
        }

        .login_btn {
            background: #fa729a;
            color: #fff;
            border: 1px solid #fa729a;
            margin-top: 10px;
            height: 35px;
            font-size: 16px;
        }

        .resize {
            color: #aaa;
        }

        a:hover {
            color: #fa729a;
            text-decoration: none;
        }

        .radio-input {
            position: absolute;
            left: 80px;
            top: 2px;
            width: 16px;
        }

        .radio-input:last-child {
            left: 143px;
        }

        .radio-label {
            margin-left: 20px;
        }

        .form-select {
            margin-left: 10px;
            width: 170px;
            height: 24px;
            line-height: 24px;
        }
    </style>
    <script src="./code/jquery.min.js"></script>
    <script src="./code/angular.min.js"></script>
</head>

<body ng-app="myApp">
    <div ng-controller="controLogin">
        <div class="contain">
            <div class="top">修改信息</div>
            <form class="form-login" name="form-login">
                <div class="form-group">
                    <label for="login_school">学校</label>
                    <select class="form-select" name="login_school" ng-options="x for x in school"
                        ng-model="login_school" id="select" ng-change=style()></select>
                </div>
                <div class="form-group">
                    <label for="login_sex">性别</label>
                    <label class="radio-inline"></label>
                    男<input type="radio" class="form-input radio-input" name="sex" id="nan" ng-model="login_sex"
                        ng-value=0 required>
                    <label class="radio-inline radio-label"></label>
                    女<input type="radio" class="form-input radio-input" name="sex" id="nv" ng-model="login_sex"
                        ng-value=1 required>
                </div>
                <div class="form-group">
                    <label for="login_user">账号</label>
                    <input type="text" class="form-input" name="login_user" id="login_user" ng-model="login_user"
                        required>
                </div>

                <button class="btn btn-primary login_btn btn-block" ng-click="login_ok()">确 认</button>
            </form>

        </div>

    </div>
    <script>
        var url = decodeURI(location.search);
        console.log(url);
        var urlArr = url.split('=')[1];
        var app = angular.module('myApp', []);
        app.controller('controLogin', function ($scope) {
            // 学校
            $scope.login_school = '广州大学';
            
            // 用户名
            $scope.login_user = '';
            //性别
            //$scope.login_sex = 1;
            //密码

            $scope.school = ['广州大学','华南师范大学','星海音乐学院','中山大学','广东外语外贸大学','广州中医药大学','华南理工大学','广东工业大学'];
            $scope.style =function (){
                console.log($scope.login_school);
            }
            
            // 初始化
            function init() {
                getUserAjax();
            }
            // 信息验证
            $scope.login_ok = function () {
                if (!$scope.login_school) {
                    alert("学校不能为空！");
                    return false;
                }
                if (!$scope.login_user) {
                    alert("账号不能为空！");

                    return false;
                }
                var obj = {};
                obj.school = $scope.login_school;
                obj.username = $scope.login_user;
                obj.gender = parseInt($scope.login_sex);
                obj.token = urlArr;
                console.log(obj);
                ajax(obj);
            }
            function location(t) {
                if (t.code == 200) {
                    setTimeout(function () {
                        window.location.href = "./me.html?username=" + urlArr;
                    }, 0);
                }
            }
            // 发送请求
            function ajax(temp) {
                $.ajax({
                    url: 'http://120.78.91.11:8000/user/update?token=' + urlArr,
                    type: 'post',
                    // 设置的是请求参数
                    data: temp,
                    // 用于设置响应体的类型 注意 跟 data 参数没关系！！！
                    //dataType: 'json',
                    success: function (res) {
                        console.log(res);
                        var t = res;
                        location(t);
                    }
                })
            }
            //获取原本的信息,发送请求
            function getUserAjax() {
                $.ajax({
                    url: 'http://120.78.91.11:8000/user/getUserInfo?token=' + urlArr,
                    type: 'post',
                    // 设置的是请求参数
                    data: { token: urlArr },
                    // 用于设置响应体的类型 注意 跟 data 参数没关系！！！
                    //dataType: 'json',
                    success: function (res) {
                        console.log(res);
                        var t = res;
                        getUser(t);
                    }
                })
            }
            // 对原本的信息处理
            function getUser(t) {
                if (t.code == 200) {
                   
                    $scope.login_school = t.info.school;
                    
                    if (t.info.gender == '女'){
                        $scope.login_sex = 1;
                        $("#nan").prop('checked',false);
                        $("#nv").prop('checked',true);
                    } else{
                        $scope.login_sex = 0;
                        $("#nan").prop('checked',true);
                        $("#nv").prop('checked',false);
                    }
                    $scope.login_user = t.info.username;
                    $("#login_user").val($scope.login_user);
                    
                }
               
            }
            init();
        });
    </script>
</body>

</html>
